<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ob-moments: Clip Review Dashboard</title>
<style>
:root{
  --bg:#0b0e14; --panel:#151a23; --panel2:#1c222e; --line:#2a3140;
  --txt:#e7ecf3; --mut:#8b97a8; --mut2:#637085;
  --good:#2ecc71; --bad:#ff5d6c; --warn:#ffb547; --accent:#5b8def;
  --r:12px; --gap:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.45;padding-bottom:90px}
.wrap{max-width:900px;margin:0 auto;padding:16px}
a{color:var(--accent)}

/* header */
header{background:linear-gradient(135deg,#11151d,#171d28);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:var(--gap)}
h1{font-size:18px;font-weight:700;letter-spacing:.2px}
h1 .sub{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-top:3px}
.ep-select{margin-top:14px;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:13.5px;font-weight:600}
.ep-meta{font-size:11.5px;color:var(--mut);margin-top:8px}
.ep-meta b{color:var(--txt)}

/* rendered-clips players */
.clips-row{margin:14px 0 18px}
.clips-head{margin:0 0 10px;font-size:14px;color:var(--accent, #7aa2f7);text-transform:uppercase;letter-spacing:.06em}
.clips-grid{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.clipbox{margin:0;flex:0 0 auto;width:200px}
.clipbox video{width:200px;aspect-ratio:9/16;border-radius:10px;background:#000;border:1px solid var(--line,#2a3140)}
.clipbox figcaption{font-size:11px;color:#8a93a5;margin-top:4px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clipbox figcaption.clip-meta{color:var(--mut2);font-size:10.5px;margin-top:2px}
/* horizontal (16:9) clips render wider + shorter than the default 9:16 box */
.clipbox.h{width:340px}
.clipbox.h video{width:340px;aspect-ratio:16/9}
.clipbox.h figcaption{max-width:340px}
.orient-tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--mut2);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:middle}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;position:relative}
.card.approved{border-color:var(--good);box-shadow:0 0 0 1px var(--good)}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.chead-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rank{font-size:12px;font-weight:700;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:20px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.score{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.score.good{background:#2ecc7122;color:var(--good);border:1px solid #2ecc7155}
.score.amber{background:#ffb54722;color:var(--warn);border:1px solid #ffb54755}
.score.grey{background:#8b97a822;color:var(--mut);border:1px solid #8b97a855}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.lever{color:var(--accent);border-color:#5b8def55}
.chip.buyer{color:var(--good);border-color:#2ecc7155}
.chip.archetype{color:var(--warn);border-color:#ffb54755}
.chip.dur{color:var(--mut)}

.onhook{font-size:19px;font-weight:800;line-height:1.3;color:#fff;margin-bottom:6px}
.hookline{font-size:12.5px;color:var(--mut);margin-bottom:10px;line-height:1.4}
.quotable{font-size:12.5px;color:var(--txt);background:#5b8def0d;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 11px;margin-bottom:12px;font-style:italic}
.quotable.empty{display:none}

.music-box{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.music-box .mv{font-weight:700;color:#fff;margin-bottom:4px}
.music-box .lane{color:var(--mut);margin-top:3px;line-height:1.4}
.music-box .lane b{color:var(--txt)}

.section{margin-bottom:8px}
.section-toggle{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--txt);font-size:12.5px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.section-toggle:hover{background:#232a38}
.section-toggle .arrow{color:var(--mut);font-size:11px;transition:transform .15s}
.section-toggle.open .arrow{transform:rotate(90deg)}
.section-body{display:none;background:var(--panel2);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:12px;font-size:12.5px;line-height:1.55;color:var(--txt);white-space:pre-wrap}
.section-body.open{display:block}
.copy-btn{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:6px;border:1px solid var(--accent);background:#5b8def18;color:var(--accent);cursor:pointer;margin-top:8px}
.copy-btn:hover{background:#5b8def30}
.copy-btn.done{border-color:var(--good);background:#2ecc7118;color:var(--good)}

.cfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.approve-btn{flex:1;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.approve-btn:hover{border-color:var(--good)}
.approve-btn.on{background:linear-gradient(135deg,#16a34a,#2ecc71);color:#fff;border-color:transparent}
.cmd-btn{padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.cmd-btn:hover{color:var(--txt);border-color:var(--accent)}

.no-gate{font-size:12px;color:var(--mut);padding:20px;text-align:center}

/* sticky footer */
.sticky-footer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#11151d,#171d28);border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:50}
.sf-count{font-size:13px;font-weight:700;color:var(--txt)}
.sf-count .n{color:var(--good);font-size:16px}
.sf-copy{padding:10px 18px;border-radius:8px;border:none;background:linear-gradient(135deg,#16a34a,#2ecc71);color:#fff;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.sf-copy:hover{opacity:.92}
.sf-copy:disabled{opacity:.4;cursor:not-allowed}
.sf-copy.done{background:linear-gradient(135deg,#3b5bdb,#5b8def)}

@media (max-width:480px){
  .wrap{padding:10px}
  .card{padding:12px}
  .onhook{font-size:17px}
}
</style>
</head>

<script>
const DATA = {"episodes":[{"video_id":"-oNRtyqu-vo","title":"-oNRtyqu-vo","moments":[{"id":691,"title":"It's never been easier actually.","start":896.16,"end":920.0,"dur":23.8,"hook_line":"It's never been easier actually.","onscreen_hook":"It's never been easier actually.","hook_archetype":null,"quotable_line":"","text":"It's never been easier actually. But people don't look at their day from the right perspective or the right lens with for me it would be all right, let me hammer out an hour of deep work and then I've got a 17 or 20 minute gap between calls. So in that 20-minute gap, I'm going to walk for 10 minutes and then come back to my desk and prep for the call for 10 minutes. And then I might have 10 minutes between calls. So I'll do a five minute walk, five minutes to get my mind right.","score":54.1,"subscores":{"hook":80,"curiosity":15,"arousal":46,"context":80,"payoff":30,"controversy":40,"numbers":100,"list":10,"you":0,"quotable":70},"engagement_lever":"save","buyer_relevance":null,"gate_passed":true,"gate_reason":"","music":{},"ig_post":{},"advice":null,"rank":1},{"id":764,"title":"You just don't talk about that ever.","start":985.76,"end":1025.04,"dur":39.3,"hook_line":"You just don't talk about that ever.","onscreen_hook":"You just don't talk about that ever.","hook_archetype":null,"quotable_line":"","text":"You just don't talk about that ever. Yeah. It helps with teaching. I think I think that's a really cool thing about doing calls with clients and relating to life. One thing I really learned a lot as coaching, like with my coaching, I don't do meal plans. I don't believe in meal plans cuz if you do meal plans with a client, the second they're off meal plan, they go back to square one. They didn't learn anything. They're not adapting. So with aviation, you learn this really cool acronym where it's Roku, wrote, understanding, application, correlation. So you're doing rote memory. You can regurgitate it. You can be like, \"Oh, my coach said 200 g of chicken, 200 g of rice. I can do that.\" You're not understanding. You're not correlating. You're not applying anything.","score":44.1,"subscores":{"hook":80,"curiosity":55,"arousal":15,"context":50,"payoff":30,"controversy":10,"numbers":60,"list":70,"you":59,"quotable":88},"engagement_lever":"save","buyer_relevance":null,"gate_passed":true,"gate_reason":"","music":{},"ig_post":{},"advice":null,"rank":2},{"id":2162,"title":"What do you mean by that?","start":2700.96,"end":2743.52,"dur":42.6,"hook_line":"What do you mean by that?","onscreen_hook":"What do you mean by that?","hook_archetype":null,"quotable_line":"","text":"What do you mean by that? If you say only have a high protein diet will change your life. Okay, I have a high protein type. I mean 6,000 calories. Gone. Uh only eat whole foods. All right. I love food. I eat 6,000 calories of steak. Gone. I'm doing the carnivore diet. Oh, you have a high LDL. You have iron overload which causes diabetes early on because your hemoglobin gets really high because the iron lo overload. Gone. Keto. I'm losing fat because my body is running on ketosis and um it's running off fats, not glucose. All right. You're eating excessive calories. gone. So technically everything's a fat loss myth. It's all about moderation, understanding the key values of sustainability. Don't be an extremist and fit in your lifestyle because if you lose weight for 90 days, you gain it all back.","score":43.9,"subscores":{"hook":80,"curiosity":40,"arousal":15,"context":80,"payoff":30,"controversy":40,"numbers":90,"list":10,"you":62,"quotable":58},"engagement_lever":"save","buyer_relevance":null,"gate_passed":true,"gate_reason":"","music":{},"ig_post":{},"advice":null,"rank":3},{"id":2045,"title":"What's your biggest fear in the entrepreneurship space?","start":2545.6,"end":2585.92,"dur":40.3,"hook_line":"What's your biggest fear in the entrepreneurship space?","onscreen_hook":"What's your biggest fear in the entrepreneurship space?","hook_archetype":null,"quotable_line":"","text":"What's your biggest fear in the entrepreneurship space? Like when it comes to earning a living, when it comes to how we make a living, what are you scared of? Yeah, it's a great question. I think off social norms, it all crumbling down. Even though I know it's an irrational fear because I've been doing it for so long and it's sustainable and it only grows. the fear of the unexpected, but I also try to rationalize it where, for example, close friend of mine, his company just laid off 60% of their company. So there's no guarantees in life truly. Like if you're working a 9 to5, that doesn't mean you're set for life. I have family friends that worked for a company for 20 plus years and they got let go. No furlow, nothing. And or not furough, that's aviation.","score":37.6,"subscores":{"hook":80,"curiosity":40,"arousal":74,"context":50,"payoff":30,"controversy":10,"numbers":30,"list":10,"you":25,"quotable":80},"engagement_lever":"share","buyer_relevance":null,"gate_passed":true,"gate_reason":"","music":{},"ig_post":{},"advice":null,"rank":4},{"id":3036,"title":"Why if I eat 6,000 calories every day?","start":3779.44,"end":3818.96,"dur":39.5,"hook_line":"Why if I eat 6,000 calories every day?","onscreen_hook":"Why if I eat 6,000 calories every day?","hook_archetype":null,"quotable_line":"","text":"Why if I eat 6,000 calories every day? Why is my body not adapting to that then? Yeah, that's a great point. I've never thought about that. If I'm in 1,000 calorie surplus, why isn't my metabolism going nuclear? Yeah. So, it's the same thing. So like when I'm bulking, I have to increase my calories cuz I hit a certain level of weight gain and that's my new maintenance. So I increase my calories by 200 lb. So genuinely when you simplify things, you become hyper aware and analytical of your body cuz you're like, \"Wow, it's actually that simple. If I'm not losing weight, I decrease the calories. If I'm not gaining weight, I increase the calories.\" It's just really that simple. You should care about the macronutrients because it has been shown high protein diet, you burn less muscle, you keep more muscle in the body, you burn more pure fat, things like that.","score":30.1,"subscores":{"hook":80,"curiosity":40,"arousal":15,"context":20,"payoff":30,"controversy":40,"numbers":90,"list":10,"you":45,"quotable":86},"engagement_lever":"save","buyer_relevance":null,"gate_passed":true,"gate_reason":"","music":{},"ig_post":{},"advice":null,"rank":5},{"id":1607,"title":"Applying all that knowledge I got to\u2026","start":2029.6,"end":2068.48,"dur":38.9,"hook_line":"So, applying all that knowledge I got to show that you can do it in 7 months.","onscreen_hook":"Applying all that knowledge I got to show\u2026","hook_archetype":"transformation_proof","quotable_line":"","text":"So, applying all that knowledge I got to show that you can do it in 7 months. I didn't show my physique until I hit 100K followers to prove that you can do it without having physique and social proof. You even would give me crap about it behind the scenes. You were like, \"Dude, why don't you ever show your credentials or your social proof?\" And I was so adamant about I know social media so well and I've studied these things so well and learning the back-end approaches from coaching for years and learning how to make it organized not just for you but for your clients. Be a good coach. Make sure you keep a good product while building a business because if you don't have a good product, you're not there to help people. What's the point? Genuinely, if you're there just for money, this is not the job for you.","score":28.9,"subscores":{"hook":80,"curiosity":60,"arousal":15,"context":20,"payoff":30,"controversy":10,"numbers":30,"list":10,"you":81,"quotable":90},"engagement_lever":"share","buyer_relevance":null,"gate_passed":true,"gate_reason":"","music":{},"ig_post":{},"advice":null,"rank":6},{"id":1748,"title":"You might want to look at that a\u2026","start":2218.0,"end":2257.92,"dur":39.9,"hook_line":"You might want to look at that a little deeper.","onscreen_hook":"This is why 97% of fitness coaches suck.","hook_archetype":null,"quotable_line":"","text":"You might want to look at that a little deeper. Yeah. Yeah. I see it all the time like follow these methods to grow and it's like why aren't you using your methods? Yeah. You have 80 likes. It's not to be a hater, but um in terms of the on that note, like the the focus if you're getting started on social media, this is just for the people who are aspiring aspiring creators or social media business owners. In my opinion, it should be totally remove the option of of having a coaching offer. Focus for the first 3 months, maybe 6 months on how much goodwill and value and trust can I build. I don't even I didn't even talk about a coaching offer for like 5 months. And then when I finally said, uh, there's a link in my bio if you, then the calls just flooded in because I had spent all this time showing people and Hormosi calls it a piggy bank.","score":22.9,"subscores":{"hook":40,"curiosity":40,"arousal":58,"context":20,"payoff":30,"controversy":10,"numbers":90,"list":70,"you":32,"quotable":58},"engagement_lever":"save","buyer_relevance":null,"gate_passed":true,"gate_reason":"","music":{},"ig_post":{},"advice":null,"rank":7}],"total_moments":15,"gate_passed_count":7,"rendered_clips":[{"name":"clip_01_there-s-no-65-year-old-retiring-saying-y.mp4","src":"clips/-oNRtyqu-vo-there-s-no-65-year-old-retiring-saying-y/clip_01_there-s-no-65-year-old-retiring-saying-y.mp4","mtime":1783127959.679147,"duration":52.7,"orientation":"vertical"},{"name":"clip_02_you-just-don-t-talk-about-that-ever.mp4","src":"clips/-oNRtyqu-vo-there-s-no-65-year-old-retiring-saying-y/clip_02_you-just-don-t-talk-about-that-ever.mp4","mtime":1783128049.1354198,"duration":51.6,"orientation":"vertical"}],"last_rendered_at":1783128049.1354198},{"video_id":"0722-2","title":"0722-2","moments":[{"id":1127,"title":"You always have to think, can I do\u2026","start":1592.6,"end":1617.08,"dur":24.5,"hook_line":"You always have to think, can I do this for 10 years?","onscreen_hook":"You always have to think, can I do\u2026","hook_archetype":null,"quotable_line":"","text":"You always have to think, can I do this for 10 years? The answer is no, you're not doing something right. And granted, there's some differences. There's seasons in life, there's phases in life where I think there is times in life where you need to deny your flesh in times in life that you have absolute discipline, maybe 30 days of no drinking. Maybe 30 days of no drinking and eating protein and tracking your calories, all these things. And then actually making it more subtle 'cause maintenance is easier than losing the weight.","score":66.8,"subscores":{"hook":100,"curiosity":40,"arousal":15,"context":80,"payoff":30,"controversy":40,"numbers":90,"list":10,"you":56,"quotable":98},"engagement_lever":"save","buyer_relevance":null,"gate_passed":true,"gate_reason":"","music":{},"ig_post":{},"advice":null,"rank":1},{"id":605,"title":"Imagine when you're 50 years old, I actually\u2026","start":869.6,"end":895.24,"dur":25.6,"hook_line":"Imagine when you're 50 years old, I actually have a couple, not a couple.","onscreen_hook":"Imagine when you're 50 years old, I actually have\u2026","hook_archetype":null,"quotable_line":"","text":"Imagine when you're 50 years old, I actually have a couple, not a couple. We got you a lot of listeners that are over 50 years old. Your max squat is gonna be performed every single day of the older you get. Just think about that. Every single day you squatting out of your seat is gonna be your max, your one rep max. That sucks. That really sucks. Just because you're taking the, I would say easy way, but it's almost the lazy way.","score":66.1,"subscores":{"hook":100,"curiosity":15,"arousal":46,"context":80,"payoff":30,"controversy":40,"numbers":60,"list":10,"you":95,"quotable":88},"engage  actually getting your essential fats, your essential lipid. So, I think people fear because every gram of fat has 9 calories versus carbs, 4 calories, protein, 4 calories, fiber, 2 calories. Eat your fiber. Fat is actually really important regulating your your ghrelin, your leptin, your recovery, your testosterone, your estrogen, your progesterone, everything. It is so important. So, make sure you're getting your fats in cuz that's going to help you fall asleep. Make sure you're getting your magnesium. Magnesium's going to help in your recovery. It's actually going to help your nervous system. It's going to help you fall asleep. It's going to be fantastic for so many things. So, make sure your diet is in check as well. You're getting your protein, you're getting your fats, you're getting your fiber as well.","score":53.7,"subscores":{"hook":80,"curiosity":15,"arousal":46,"context":80,"payoff":30,"controversy":40,"numbers":100,"list":10,"you":100,"quotable":68},"engagement_lever":"share","buyer_relevance":null,"gate_passed":true,"gate_reason":"","music":{},"ig_post":{},"advice":null,"rank":4},{"id":409,"title":"For rest, like actual rest, not rest periods\u2026","start":502.52,"end":545.56,"dur":43.0,"hook_line":"So, for rest, like actual rest, not rest periods, you need to be sleeping 7 to 9 hours a night.","onscreen_hook":"For rest, like actual rest, not rest periods\u2026","hook_archetype":null,"quotable_line":"","text":"So, for rest, like actual rest, not rest periods, you need to be sleeping 7 to 9 hours a night. Sleep is everything. There's actually a really cool study that they conduct every single year called daylight savings. There's more crashes, more deaths, more cancer, more everything when they lose 1 hour of sleep. And then the inverse, almost exact, granted, correlative, not causation, in the other direction when they get the extra hour of sleep. So, now imagine your recovery. If you're not getting your sleep in, you're not recovering properly. And I const STORAGE_KEY = "ob_moments_approved_v1";
const EPISODE_STORAGE_KEY = "ob_moments_last_episode_v1";

function loadLastEpisode(){
  try{ return localStorage.getItem(EPISODE_STORAGE_KEY) || null; }catch(e){ return null; }
}
function saveLastEpisode(videoId){
  try{ localStorage.setItem(EPISODE_STORAGE_KEY, videoId); }catch(e){ /* ignore */ }
}

function fmtDate(epochSec){
  if (!epochSec) return "";
  const d = new Date(epochSec * 1000);
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function fmtDuration(sec){
  if (sec == null) return "";
  sec = Math.round(sec);
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m > 0 ? (m + ":" + String(s).padStart(2, "0")) : (s + "s");
}

function loadApproved(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  }catch(e){ return {}; }
}
function saveApproved(state){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
let approved = loadApproved();

function fmtTime(sec){
  sec = Math.round(sec || 0);
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ":" + String(s).padStart(2, "0");
}

function scoreClass(score){
  if (score >= 55) return "good";
  if (score >= 45) return "amber";
  return "grey";
}

function slugify(str){
  return (str || "clip")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "")
    .slice(0, 60) || "clip";
}

function escDouble(str){
  return (str || "").replace(/\\/g, "\\\\").replace(/"/g, '\\"');
}

function firstWords(str, n){
  return (str || "").trim().split(/\s+/).slice(0, n).join(" ");
}
function lastWords(str, n){
  const parts = (str || "").trim().split(/\s+/);
  return parts.slice(Math.max(0, parts.length - n)).join(" ");
}

function momentKey(videoId, momentId){
  return videoId + "::" + momentId;
}

function buildRenderCommand(videoId, m){
  const videoPath = "~/ob-moments/work/" + videoId + ".mp4";
  const slug = slugify(m.onscreen_hook || m.hook_line || m.title);
  const outPath = "~/ob-clipper/out/approved/" + slug + ".mp4";
  const headline = escDouble(m.onscreen_hook || m.hook_line || "");
  const expectFirst = escDouble(firstWords(m.hook_line || "", 5));
  const expectLast = escDouble(lastWords(m.text || "", 5));

  return [
    "python3 ~/ob-clipper/bin/render_clip.py",
    "--video " + videoPath,
    "--start " + m.start,
    "--end " + m.end,
    '--out ' + outPath,
    '--headline "' + headline + '"',
    "--cover-source-captions",
    '--expect-first "' + expectFirst + '"',
    '--expect-last "' + expectLast + '"'
  ].join(" ");
}

function copyToClipboard(text, btn, doneLabel){
  navigator.clipboard.writeText(text).then(() => {
    if (btn){
      const orig = btn.textContent;
      btn.textContent = doneLabel || "Copied";
      btn.classList.add("done");
      setTimeout(() => {
        btn.textContent = orig;
        btn.classList.remove("done");
      }, 1600);
    }
  });
}

function renderMusicBox(music){
  if (!music || !music.vibe) return "";
  const laneA = music.lane_a || {};
  const laneB = music.lane_b || {};
  let html = '<div class="music-box">';
  html += '<div class="mv">Music vibe: ' + escapeHtml(music.vibe) + '</div>';
  if (laneA.style){
    html += '<div class="lane"><b>Lane A (burned-in):</b> ' + escapeHtml(laneA.style) + '</div>';
  }
  if (laneB.trend){
    html += '<div class="lane"><b>Lane B (in-app):</b> ' + escapeHtml(laneB.trend) + '</div>';
  }
  html += '</div>';
  return html;
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

function buildCard(videoId, m){
  const key = momentKey(videoId, m.id);
  const isApproved = !!approved[key];
  const sc = scoreClass(m.score);

  const card = document.createElement("div");
  card.className = "card" + (isApproved ? " approved" : "");
  card.dataset.key = key;

  const onHook = m.onscreen_hook || m.hook_line || m.title || "";
  const durRange = fmtTime(m.start) + "–" + fmtTime(m.end);

  let metaChips = "";
  metaChips += '<span class="chip dur">' + Math.round(m.dur) + 's · ' + durRange + '</span>';
  if (m.engagement_lever){
    metaChips += '<span class="chip lever">' + escapeHtml(m.engagement_lever) + '</span>';
  }
  if (m.buyer_relevance){
    metaChips += '<span class="chip buyer">' + escapeHtml(m.buyer_relevance) + '</span>';
  }
  if (m.hook_archetype){
    metaChips += '<span class="chip archetype">' + escapeHtml(m.hook_archetype) + '</span>';
  }

  let html = "";
  html += '<div class="chead">';
  html += '  <div class="chead-left">';
  html += '    <span class="rank">#' + m.rank + '</span>';
  html += '    <span class="score ' + sc + '">' + Math.round(m.score) + '</span>';
  html += '  </div>';
  html += '</div>';
  html += '<div class="meta-row">' + metaChips + '</div>';
  html += '<div class="onhook">' + escapeHtml(onHook) + '</div>';
  html += '<div class="hookline">' + escapeHtml(m.hook_line || "") + '</div>';

  if (m.quotable_line){
    html += '<div class="quotable">“' + escapeHtml(m.quotable_line) + '”</div>';
  }

  html += renderMusicBox(m.music);

  // IG caption section
  const igPost = m.ig_post || {};
  if (igPost.caption){
    html += '<div class="section">';
    html += '  <button class="section-toggle" data-target="ig-' + key + '">IG caption <span class="arrow">▸</span></button>';
    html += '  <div class="section-body" id="ig-' + key + '">';
    html += escapeHtml(igPost.caption);
    if (igPost.posting_window && igPost.posting_window.primary){
      html += '\n\nPosting window: ' + escapeHtml(igPost.posting_window.primary);
    }
    html += '    <div><button class="copy-btn" data-copy-ig="' + key + '">Copy caption</button></div>';
    html += '  </div>';
    html += '</div>';
  }

  // Advice section
  if (m.advice){
    html += '<div class="section">';
    html += '  <button class="section-toggle" data-target="advice-' + key + '">Clip advice <span class="arrow">▸</span></button>';
    html += '  <div class="section-body" id="advice-' + key + '">' + escapeHtml(m.advice) + '</div>';
    html += '</div>';
  }

  html += '<div class="cfoot">';
  html += '  <button class="approve-btn ' + (isApproved ? "on" : "") + '" data-approve="' + key + '">' + (isApproved ? "✓ Approved" : "Approve") + '</button>';
  html += '  <button class="cmd-btn" data-cmd="' + key + '">Copy cmd</button>';
  html += '</div>';

  card.innerHTML = html;
  return card;
}

function renderEpisode(videoId){
  const ep = DATA.episodes.find(e => e.video_id === videoId);
  const cardsEl = document.getElementById("cards");
  cardsEl.innerHTML = "";

  const metaEl = document.getElementById("epMeta");
  if (!ep){
    metaEl.textContent = "";
    return;
  }
  metaEl.innerHTML = '<b>' + ep.gate_passed_count + '</b> of ' + ep.total_moments + ' moments passed the gate';

  // WATCH: finished renders for this episode, playable inline (served via the
  // app/clips symlink to ~/ob-clipper/out; requires the local server, not file://)
  if (ep.rendered_clips && ep.rendered_clips.length){
    const wrap = document.createElement('div');

      '<div class="clips-grid">' + ep.rendered_clips.map(c => {
        const meta = [fmtDate(c.mtime), fmtDuration(c.duration)].filter(Boolean).join(' · ');
        const isH = c.orientation === 'horizontal';
        const tag = '<span class="orient-tag">' + (isH ? 'H' : 'V') + '</span>';
        return '<figure class="clipbox' + (isH ? ' h' : '') + '"><video controls preload="metadata" src="' + c.src + '"></video>' +
          '<figcaption>' + escapeHtml(c.name.replace(/^clip_\d+_/, '').replace(/_h\.mp4$/, '').replace(/\.mp4$/, '').replace(/-/g, ' ')) + tag + '</figcaption>' +
          (meta ? '<figcaption class="clip-meta">' + escapeHtml(meta) + '</figcaption>' : '') +
          '</figure>';
      }).join('') + '</div>';
    cardsEl.appendChild(wrap);
  }

  if (!ep.moments.length){
    cardsEl.innerHTML = '<div class="no-gate">No gate-passed moments for this episode.</div>';
    return;
  }

  ep.moments.forEach(m => {
    cardsEl.appendChild(buildCard(videoId, m));
  });

  updateApprovedCount();
}

function currentEpisodeId(){
  return document.getElementById("epSelect").value;
}

function findMoment(videoId, momentId){
  const ep = DATA.episodes.find(e => e.video_id === videoId);
  if (!ep) return null;
  return ep.moments.find(m => String(m.id) === String(momentId));
}

function updateApprovedCount(){
  document.getElementById("approvedCount").textContent = Object.keys(approved).filter(k => approved[k]).length;
}

function init(){
  const select = document.getElementById("epSelect");
  DATA.episodes.forEach(ep => {
    const opt = document.createElement("option");
    opt.value = ep.video_id;
    opt.textContent = ep.title + " (" + ep.gate_passed_count + ")";
    select.appendChild(opt);
  });

  select.addEventListener("change", () => {
    const videoId = currentEpisodeId();
    saveLastEpisode(videoId);
    renderEpisode(videoId);
  });

  if (DATA.episodes.length){
    let initialId = null;
    const lastId = loadLastEpisode();
    if (lastId && DATA.episodes.some(e => e.video_id === lastId)){
      initialId = lastId;
    } else {
      // default to the episode with the newest rendered clip
      let best = null;
      DATA.episodes.forEach(ep => {
        if (ep.last_rendered_at && (!best || ep.last_rendered_at > best.last_rendered_at)){
          best = ep;
        }
      });
      initialId = best ? best.video_id : DATA.episodes[0].video_id;
    }
    select.value = initialId;
    renderEpisode(initialId);
  }

  document.getElementById("cards").addEventListener("click", (e) => {
    const toggle = e.target.closest(".section-toggle");
    if (toggle){
      const targetId = toggle.dataset.target;
      const body = document.getElementById(targetId);
      const isOpen = body.classList.toggle("open");
      toggle.classList.toggle("open", isOpen);
      return;
    }

    const approveBtn = e.target.closest("[data-approve]");
    if (approveBtn){
      const key = approveBtn.dataset.approve;
      approved[key] = !approved[key];
      saveApproved(approved);
      approveBtn.classList.toggle("on", approved[key]);
      approveBtn.textContent = approved[key] ? "✓ Approved" : "Approve";
      approveBtn.closest(".card").classList.toggle("approved", approved[key]);
      updateApprovedCount();
      return;
    }

    const copyIgBtn = e.target.closest("[data-copy-ig]");
    if (copyIgBtn){
      const key = copyIgBtn.dataset.copyIg;
      const [videoId, momentId] = key.split("::");
      const m = findMoment(videoId, momentId);
      if (m && m.ig_post && m.ig_post.caption){
        copyToClipboard(m.ig_post.caption, copyIgBtn, "Copied");
      }
      return;
    }

    const cmdBtn = e.target.closest("[data-cmd]");
    if (cmdBtn){
      const key = cmdBtn.dataset.cmd;
      const [videoId, momentId] = key.split("::");
      const m = findMoment(videoId, momentId);
      if (m){
        copyToClipboard(buildRenderCommand(videoId, m), cmdBtn, "Copied");
      }
      return;
    }
  });

  document.getElementById("copyAllBtn").addEventListener("click", (e) => {
    const btn = e.target;
    const cmds = [];
    DATA.episodes.forEach(ep => {
      ep.moments.forEach(m => {
        const key = momentKey(ep.video_id, m.id);
        if (approved[key]){
          cmds.push(buildRenderCommand(ep.video_id, m));
        }
      });
    });
    if (!cmds.length){
      return;
    }
    copyToClipboard(cmds.join("\n\n"), btn, "Copied " + cmds.length);
  });
}

init();
</script>
</body>
</html>
